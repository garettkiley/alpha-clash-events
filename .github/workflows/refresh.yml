name: Refresh XP Network events
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: refresh, cancel-in-progress: false }
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python fetch.py
      - name: Commit if changed
        run: |
          python - <<'P'
          import json,subprocess
          new=json.load(open('events.json'))
          try: old=json.loads(subprocess.run(['git','show','HEAD:events.json'],capture_output=True,text=True).stdout)
          except Exception: old={}
          if old.get('events')==new['events']:
              subprocess.run(['git','checkout','events.json'])
          P
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add events.json
          git diff --cached --quiet || (git commit -m "Refresh events $(date -u +%FT%TZ)" && git push)
